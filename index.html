<!DOCTYPE html>
<html lang="pt-BR">



<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha lista de Tarefas</title>
    <link rel="stylesheet" href="style.css">
</head>



<body>

    <main class="container">

        <header>
            <h1 class="titulo-destaque">Minhas tarefas</h1>
            <p>Organize o seu dia a dia de forma simples</p>

        <form id="form-tarefa">
            <input type="text" id="input-tarefa" placeholder="Digite uma nova tarefa..." required autocomplete="off">
            <button type="submit" id="btn-adicionar">+</button>
        </form>

        <ul id="lista-tarefas">

        </ul>

    </main>

        <script src="script.js"></script>

</body>



</html>
